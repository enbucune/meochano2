<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeowChanO - Trại Mèo (Bản Test UI)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Space+Mono:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#EFE8D8; --paper-deep:#E4DBC6; --ink:#2E2A24;
    --card:#FFFCF5; --pink:#F3A8B7; --pink-deep:#E88BA0;
    --stamp:#C1443E; --line:#B8A88C; --available:#748C67;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--paper);
    background-image: radial-gradient(circle at 1px 1px, rgba(46,42,36,0.05) 1px, transparent 0);
    background-size: 22px 22px; color:var(--ink); font-family:'Nunito', sans-serif;
  }
  .mono{ font-family:'Space Mono', monospace; }
  .hand{ font-family:'Caveat', cursive; }

  header{ padding: 36px 20px 24px; text-align:center; }
  .badge{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--ink); color:var(--paper);
    padding: 10px 22px; border-radius: 999px;
    font-family:'Caveat', cursive; font-weight:700; font-size:34px;
    box-shadow: 3px 3px 0 var(--pink-deep);
  }
  .badge .paw-icon{ width:0.85em; height:0.85em; }
  header .tagline{
    margin: 14px 0 0; font-family:'Space Mono', monospace; font-size:12px;
    letter-spacing: 2px; text-transform: uppercase; color: #7a7263;
  }
  .perforation{
    max-width: 1040px; margin: 22px auto 0; border-top: 2px dashed var(--line); position: relative;
  }
  .perforation::before, .perforation::after{
    content:''; position:absolute; top:-9px; width:18px; height:18px;
    background: var(--paper); border-radius:50%; box-shadow: inset 0 0 0 2px var(--line);
  }
  .perforation::before{ left:-9px; } .perforation::after{ right:-9px; }

  .filters{
    max-width:1040px; margin: 28px auto 0; padding: 0 20px;
    display:flex; gap:10px; flex-wrap:wrap; align-items:center;
  }
  .filters input, .filters select{
    padding:9px 12px; border:2px solid var(--ink); border-radius:8px;
    font-size:13px; font-family:'Space Mono', monospace; background:var(--card); color:var(--ink);
  }
  .filters input::placeholder{ color:#a39a86; }
  .filters input:focus, .filters select:focus{ outline: 2px solid var(--pink-deep); outline-offset: 1px; }

  .grid{
    max-width:1040px; margin: 26px auto; padding: 0 20px;
    display:grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap:22px;
  }
  .empty{ text-align:center; padding:70px 20px; color:#96897a; font-family:'Space Mono', monospace; }

  .cat-card{
    background:var(--card); border:2px solid var(--ink); border-radius:14px;
    padding: 14px 14px 16px; cursor:pointer; position:relative; transition: transform .15s ease;
  }
  .cat-card:hover{ transform: translateY(-4px) rotate(-0.4deg); }
  .photo-wrap{
    position:relative; border-radius:8px; overflow:hidden;
    border: 2px dashed var(--line); padding:6px; background:#fff;
  }
  .photo-wrap img{
    width:100%; aspect-ratio:1/1; object-fit:cover; display:block; border-radius:4px; background:#e9e2d0;
  }
  .tape{
    position:absolute; width:46px; height:18px;
    background: rgba(243,168,183,0.55); border: 1px solid rgba(46,42,36,0.15);
    top:-8px; left: 50%; transform: translateX(-50%) rotate(-3deg);
    box-shadow: 0 1px 2px rgba(0,0,0,0.12); z-index: 2;
  }
  .stamp{
    position:absolute; top:-14px; right:-10px; width:58px; height:58px; border-radius:50%;
    border: 2.5px solid var(--stamp); color:var(--stamp);
    display:flex; align-items:center; justify-content:center; text-align:center;
    transform: rotate(-10deg); font-family:'Space Mono', monospace; font-weight:700; font-size:10.5px; line-height:1.15;
    background: rgba(255,252,245,0.9); z-index: 2;
  }
  .stamp::before{ content:''; position:absolute; inset:4px; border:1px solid var(--stamp); border-radius:50%; }
  .sold-banner{
    position:absolute; top:38%; left:-8%; width:116%;
    background: var(--stamp); color:#fff; text-align:center;
    font-family:'Space Mono', monospace; font-weight:700; letter-spacing:3px; font-size:13px;
    padding:5px 0; transform: rotate(-9deg); border-top:2px solid #fff; border-bottom:2px solid #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25); z-index: 2;
  }
  .cat-body{ padding-top:12px; }
  .cat-body .name{ font-family:'Caveat', cursive; font-size:26px; font-weight:700; line-height:1; }
  .cat-row{
    display:flex; justify-content:space-between; font-family:'Space Mono', monospace;
    font-size:11px; color:#6b6255; border-bottom:1px dotted var(--line); padding:3px 0;
  }
  .status-line{ margin-top:8px; }
  .status-chip{
    display:inline-block; font-family:'Space Mono', monospace; font-size:10px; font-weight:700;
    letter-spacing:1px; padding:3px 9px; border-radius:20px; text-transform:uppercase;
  }
  .status-chip.available{ background:rgba(116,140,103,0.18); color:var(--available); border:1px solid var(--available); }
  .status-chip.sold{ background:rgba(193,68,62,0.12); color:var(--stamp); border:1px solid var(--stamp); }

  .overlay{ position:fixed; inset:0; background:rgba(46,42,36,0.55); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50; }
  .hidden{ display:none !important; }
  .modal{
    background:var(--card); border:2.5px solid var(--ink); border-radius:16px;
    max-width:460px; width:100%; max-height:90vh; overflow-y:auto; position:relative;
    box-shadow: 6px 6px 0 var(--pink-deep);
  }
  .modal .photo-wrap{ margin:16px 16px 0; }
  .modal .content{ padding:18px 20px 22px; }
  .modal .name{ font-family:'Caveat', cursive; font-size:34px; font-weight:700; margin:6px 0 0; }
  .id-line{ font-family:'Space Mono', monospace; font-size:11px; color:#96897a; letter-spacing:1px; margin-bottom:10px; }
  .info-table{ width:100%; border-collapse:collapse; margin: 10px 0; }
  .info-table td{ font-family:'Space Mono', monospace; font-size:13px; padding:6px 0; border-bottom:1px dotted var(--line); }
  .info-table td:first-child{ color:#8a8071; width:38%; text-transform:uppercase; letter-spacing:1px; font-size:11px; }
  .price-stamp{
    display:inline-flex; align-items:center; justify-content:center;
    border:2.5px solid var(--stamp); color:var(--stamp); border-radius:50%;
    width:84px; height:84px; transform:rotate(-8deg); float:right; margin: 4px 0 8px 10px;
    font-family:'Space Mono', monospace; font-weight:700; font-size:13px; text-align:center; line-height:1.2;
    position:relative;
  }
  .price-stamp::before{ content:''; position:absolute; inset:5px; border:1px solid var(--stamp); border-radius:50%; }
  .desc{ font-size:14px; line-height:1.7; color:#4a4438; margin-top:6px; clear:both; }
  .contact-btns{ display:flex; gap:10px; margin-top:18px; }
  .contact-btns a{
    flex:1; text-align:center; padding:12px; border-radius:9px; font-weight:700; text-decoration:none;
    font-family:'Space Mono', monospace; font-size:13px; letter-spacing:.5px;
  }
  .btn-call{ background:var(--ink); color:var(--paper); }
  .btn-zalo{ background:var(--card); color:var(--ink); border:2px dashed var(--ink); }
  .close-btn{
    position:absolute; top:10px; right:10px; background:var(--ink); color:var(--paper);
    border-radius:50%; width:30px; height:30px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:16px; z-index:2;
  }

  /* --- THANH TRÊN: ĐĂNG NHẬP + GIỎ HÀNG --- */
  .top-bar{
    max-width:1040px; margin: 0 auto; padding: 14px 20px 0;
    display:flex; justify-content:flex-end; align-items:center; gap:10px;
  }
  .btn-fb-login{
    display:inline-flex; align-items:center; gap:7px; background:#1877F2; color:#fff; border:none;
    padding:8px 16px; border-radius:999px; font-family:'Space Mono', monospace; font-size:12px; font-weight:700;
    cursor:pointer; box-shadow: 2px 2px 0 rgba(46,42,36,0.25);
  }
  .btn-fb-login:hover{ background:#1465d1; }
  .user-chip{ display:flex; align-items:center; gap:8px; background:var(--card); border:2px solid var(--ink); border-radius:999px; padding:4px 12px 4px 4px; }
  .user-chip img{ width:26px; height:26px; border-radius:50%; object-fit:cover; }
  .user-chip span{ font-family:'Space Mono', monospace; font-size:12px; max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .user-chip button{ background:none; border:none; text-decoration:underline; cursor:pointer; font-family:'Space Mono', monospace; font-size:11px; color:#6b6255; }
  .btn-cart{
    position:relative; display:inline-flex; align-items:center; justify-content:center;
    width:38px; height:38px; background:var(--card); border:2px solid var(--ink); border-radius:50%;
    cursor:pointer; font-size:17px;
  }
  .btn-cart .cart-count{
    position:absolute; top:-6px; right:-6px; background:var(--stamp); color:#fff; font-family:'Space Mono', monospace;
    font-size:10px; font-weight:700; min-width:18px; height:18px; border-radius:999px; display:flex; align-items:center; justify-content:center; padding:0 3px;
  }

  /* --- NÚT TIM TRÊN CARD --- */
  .like-btn{
    position:absolute; top:8px; left:8px; z-index:3; background:rgba(255,252,245,0.92); border:2px solid var(--ink);
    border-radius:999px; padding:4px 9px; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:4px;
    font-family:'Space Mono', monospace; font-weight:700; color:var(--ink);
  }
  .like-btn.liked{ background:var(--stamp); color:#fff; border-color:var(--stamp); }
  .btn-add-cart{
    margin-top:10px; width:100%; padding:9px; border:2px solid var(--ink); border-radius:8px; background:var(--pink-deep);
    color:#fff; font-family:'Space Mono', monospace; font-weight:700; font-size:12px; cursor:pointer;
  }
  .btn-add-cart:disabled{ opacity:.5; cursor:not-allowed; }
  .modal .like-row{ display:flex; gap:10px; margin-top:14px; }
  .modal .like-row .like-btn{ position:static; }
  .modal .btn-add-cart{ flex:1; margin-top:0; }

  /* --- GIỎ HÀNG (DRAWER) --- */
  .cart-drawer{
    position:fixed; top:0; right:0; height:100%; width:100%; max-width:360px; background:var(--card);
    border-left:2.5px solid var(--ink); box-shadow:-6px 0 0 rgba(46,42,36,0.08); z-index:60; padding:18px;
    display:flex; flex-direction:column; transform:translateX(100%); transition:transform .2s ease;
  }
  .cart-drawer.open{ transform:translateX(0); }
  .cart-drawer h3{ font-family:'Caveat', cursive; font-size:26px; margin:6px 0 14px; }
  .cart-items{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
  .cart-item{ display:flex; gap:10px; border-bottom:1px dotted var(--line); padding-bottom:10px; align-items:center; }
  .cart-item img{ width:52px; height:52px; object-fit:cover; border-radius:8px; border:2px solid var(--ink); }
  .cart-item .info{ flex:1; }
  .cart-item .info .name{ font-family:'Caveat', cursive; font-size:18px; font-weight:700; }
  .cart-item .info .price{ font-family:'Space Mono', monospace; font-size:11px; color:#6b6255; }
  .cart-item .btn-remove{ background:none; border:none; color:var(--stamp); cursor:pointer; font-size:16px; }
  .cart-empty{ text-align:center; color:#96897a; font-family:'Space Mono', monospace; font-size:13px; padding:30px 0; }
  .cart-footer{ border-top:2px dashed var(--line); padding-top:14px; margin-top:10px; }
  .cart-total{ display:flex; justify-content:space-between; font-family:'Space Mono', monospace; font-weight:700; margin-bottom:12px; }
  .cart-drawer .contact-btns a{ flex:1; text-align:center; padding:12px; border-radius:9px; font-weight:700; text-decoration:none; font-family:'Space Mono', monospace; font-size:13px; }
  .cart-drawer-close{ align-self:flex-end; background:none; border:none; font-size:20px; cursor:pointer; margin-bottom:4px; }

  .toast{
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--paper); font-family:'Space Mono', monospace; font-size:13px;
    padding: 12px 22px; border-radius: 999px; box-shadow: 3px 3px 0 var(--pink-deep);
    opacity:0; pointer-events:none; transition: opacity .2s, transform .2s; z-index: 70;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

  @media (max-width:480px){
    .badge{ font-size:26px; padding:8px 16px; }
    .modal{ max-width: 94vw; }
    .cart-drawer{ max-width:100%; }
  }
</style>
</head>
<body>

<div class="top-bar">
  <button class="btn-fb-login" id="btn-fb-login" onclick="loginWithFacebook()">
    📘 Đăng nhập Facebook
  </button>
  <div class="user-chip hidden" id="user-chip">
    <img id="user-avatar" src="">
    <span id="user-name"></span>
    <button onclick="logout()">Đăng xuất</button>
  </div>
  <div class="btn-cart" onclick="openCart()" title="Giỏ hàng">
    🛒
    <span class="cart-count hidden" id="cart-count">0</span>
  </div>
</div>

<header>
  <div class="badge">MeowChan<svg class="paw-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="O">
    <g transform="translate(50 50) scale(1.18) translate(-50 -50)" fill="#2E2A24">
      <ellipse cx="30" cy="35" rx="13" ry="15"/>
      <ellipse cx="70" cy="35" rx="13" ry="15"/>
      <ellipse cx="12" cy="58" rx="11" ry="13"/>
      <ellipse cx="88" cy="58" rx="11" ry="13"/>
      <path d="M50 55c14 0 27 11 27 25 0 12-11 15-27 15S23 92 23 80c0-14 13-25 27-25z"/>
    </g>
    <ellipse cx="30" cy="35" rx="13" ry="15" fill="#F3A8B7" stroke="#2E2A24" stroke-width="3"/>
    <ellipse cx="70" cy="35" rx="13" ry="15" fill="#F3A8B7" stroke="#2E2A24" stroke-width="3"/>
    <ellipse cx="12" cy="58" rx="11" ry="13" fill="#F3A8B7" stroke="#2E2A24" stroke-width="3"/>
    <ellipse cx="88" cy="58" rx="11" ry="13" fill="#F3A8B7" stroke="#2E2A24" stroke-width="3"/>
    <path d="M50 55c14 0 27 11 27 25 0 12-11 15-27 15S23 92 23 80c0-14 13-25 27-25z" fill="#F3A8B7" stroke="#2E2A24" stroke-width="3"/>
  </svg></div>
  <div class="perforation"></div>
</header>

<div class="filters">
  <input id="search-box" placeholder="Tìm theo tên hoặc giống..." oninput="applyFilters()">
  <select id="breed-filter" onchange="applyFilters()">
    <option value="">Tất cả giống</option>
  </select>
  <select id="status-filter" onchange="applyFilters()">
    <option value="all">Tất cả trạng thái</option>
    <option value="available" selected>Còn bán</option>
    <option value="sold">Đã bán</option>
  </select>
  <input id="price-min" type="number" min="0" placeholder="Giá từ" oninput="applyFilters()" style="width:110px;">
  <input id="price-max" type="number" min="0" placeholder="Giá đến" oninput="applyFilters()" style="width:110px;">
  <select id="sort-filter" onchange="applyFilters()">
    <option value="newest">Mới đăng trước</option>
    <option value="price-asc">Giá: Thấp đến cao</option>
    <option value="price-desc">Giá: Cao đến thấp</option>
  </select>
</div>

<div id="grid" class="grid"></div>
<div id="empty-msg" class="empty hidden">Chưa tìm thấy hồ sơ bé mèo nào phù hợp.</div>

<!-- MODAL CHI TIẾT -->
<div id="overlay" class="overlay hidden" onclick="if(event.target===this) closeModal()">
  <div class="modal">
    <div class="close-btn" onclick="closeModal()">✕</div>
    <div class="photo-wrap">
      <div class="tape"></div>
      <img id="m-img" src="">
      <div id="m-sold-banner" class="sold-banner hidden">ĐÃ BÁN</div>
    </div>
    <div class="content">
      <div class="price-stamp" id="m-price">0đ</div>
      <div class="id-line mono" id="m-id">HỒ SƠ #----</div>
      <h2 class="name" id="m-name"></h2>
      <table class="info-table">
        <tr><td>Giống</td><td id="m-breed"></td></tr>
        <tr><td>Giới tính</td><td id="m-gender"></td></tr>
        <tr><td>Tuổi</td><td id="m-age"></td></tr>
        <tr><td>Trạng thái</td><td id="m-status"></td></tr>
      </table>
      <div class="desc" id="m-desc"></div>
      <div class="like-row">
        <button class="like-btn" id="m-like-btn" onclick="toggleLikeFromModal()">🤍 <span id="m-like-count">0</span></button>
        <button class="btn-add-cart" id="m-add-cart-btn" onclick="addToCartFromModal()">+ THÊM VÀO GIỎ</button>
      </div>
      <div class="contact-btns">
        <a id="m-call" class="btn-call" href="#">GỌI NGAY</a>
        <a id="m-zalo" class="btn-zalo" href="#" target="_blank">NHẮN ZALO</a>
      </div>
    </div>
  </div>
</div>

<!-- GIỎ HÀNG -->
<div class="overlay hidden" id="cart-overlay" onclick="if(event.target===this) closeCart()">
  <div class="cart-drawer" id="cart-drawer">
    <button class="cart-drawer-close" onclick="closeCart()">✕</button>
    <h3>🛒 Giỏ hàng của bạn</h3>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-footer">
      <div class="cart-total"><span>Tổng cộng</span><span id="cart-total">0đ</span></div>
      <div class="contact-btns">
        <a id="cart-call" class="btn-call" href="#">GỌI ĐẶT MUA</a>
        <a id="cart-zalo" class="btn-zalo" href="#" target="_blank">NHẮN ZALO</a>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// --- CẤU HÌNH LIÊN HỆ ---
const CONTACT_PHONE = '0908635094';
const CONTACT_ZALO = '0908635094';

// ============================================
// CẤU HÌNH SUPABASE — GIỐNG HỆT BÊN ADMIN DASHBOARD
// ============================================
const SUPABASE_URL = 'https://vjwbtonubfbqnufitcsr.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_6qKexKioSq-vvIzcv6m6zQ_xTZ8QGeI';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let allCats = [];
let currentUser = null;      // null nếu chưa đăng nhập
let myLikedIds = new Set();  // các cat_id mà user hiện tại đã tim
let currentModalCat = null;  // con mèo đang mở trong modal (để dùng cho nút tim/giỏ hàng trong modal)

// ============================================
// ĐĂNG NHẬP / ĐĂNG XUẤT BẰNG FACEBOOK
// ============================================
async function loginWithFacebook() {
  const cleanUrl = window.location.origin + window.location.pathname;
  const { error } = await supabaseClient.auth.signInWithOAuth({
    provider: 'facebook',
    options: {
      redirectTo: cleanUrl,
      scopes: 'public_profile'
    }
  });
  if (error) showToast('Không thể đăng nhập: ' + error.message);
}

async function logout() {
  await supabaseClient.auth.signOut();
  currentUser = null;
  myLikedIds = new Set();
  updateAuthUI();
  render(getFilteredCats());
}

function updateAuthUI() {
  const loginBtn = document.getElementById('btn-fb-login');
  const chip = document.getElementById('user-chip');
  if (currentUser) {
    loginBtn.classList.add('hidden');
    chip.classList.remove('hidden');
    const meta = currentUser.user_metadata || {};
    document.getElementById('user-avatar').src = meta.avatar_url || meta.picture || '';
    document.getElementById('user-name').textContent = meta.full_name || meta.name || 'Khách';
  } else {
    loginBtn.classList.remove('hidden');
    chip.classList.add('hidden');
  }
}

// Theo dõi trạng thái đăng nhập (tự chạy khi có sự kiện đăng nhập/đăng xuất, kể cả sau khi Facebook redirect về)
supabaseClient.auth.onAuthStateChange(async (event, session) => {
  currentUser = session ? session.user : null;
  updateAuthUI();
  await loadMyLikes();
  render(getFilteredCats());
});

// Lấy danh sách các mèo mà user hiện tại đã tim (để tô đỏ nút tim đúng trạng thái)
async function loadMyLikes() {
  myLikedIds = new Set();
  if (!currentUser) return;
  const { data, error } = await supabaseClient
    .from('cat_likes')
    .select('cat_id')
    .eq('user_id', currentUser.id);
  if (!error && data) {
    myLikedIds = new Set(data.map(r => r.cat_id));
  }
}

// Bấm nút TIM trên card danh sách
async function toggleLike(catId, event) {
  event.stopPropagation(); // không mở modal khi bấm tim
  await doToggleLike(catId);
}

// Bấm nút TIM trong modal chi tiết
async function toggleLikeFromModal() {
  if (!currentModalCat) return;
  await doToggleLike(currentModalCat.id);
}

async function doToggleLike(catId) {
  if (!currentUser) {
    showToast('Vui lòng đăng nhập Facebook để tim bé mèo này 🐾');
    return;
  }

  const cat = allCats.find(c => c.id === catId);
  if (!cat) return;

  if (myLikedIds.has(catId)) {
    // Bỏ tim
    const { error } = await supabaseClient.from('cat_likes').delete().eq('cat_id', catId).eq('user_id', currentUser.id);
    if (error) { showToast('Lỗi: ' + error.message); return; }
    myLikedIds.delete(catId);
    cat.likes_count = Math.max(0, (cat.likes_count || 0) - 1);
  } else {
    // Thêm tim
    const { error } = await supabaseClient.from('cat_likes').insert([{ cat_id: catId, user_id: currentUser.id }]);
    if (error) { showToast('Lỗi: ' + error.message); return; }
    myLikedIds.add(catId);
    cat.likes_count = (cat.likes_count || 0) + 1;
  }

  render(getFilteredCats());
  if (currentModalCat && currentModalCat.id === catId) {
    currentModalCat = cat;
    updateModalLikeButton();
  }
}

// ============================================
// GIỎ HÀNG — LƯU Ở LOCALSTORAGE, KHÔNG CẦN ĐĂNG NHẬP
// ============================================
function getCart() {
  try { return JSON.parse(localStorage.getItem('meowchan_cart') || '[]'); }
  catch { return []; }
}
function saveCart(cart) {
  localStorage.setItem('meowchan_cart', JSON.stringify(cart));
  updateCartBadge();
}
function updateCartBadge() {
  const count = getCart().length;
  const badge = document.getElementById('cart-count');
  badge.textContent = count;
  badge.classList.toggle('hidden', count === 0);
}
function isInCart(catId) {
  return getCart().some(c => c.id === catId);
}
function addToCart(cat) {
  const cart = getCart();
  if (cart.some(c => c.id === cat.id)) {
    showToast(cat.name + ' đã có trong giỏ hàng rồi!');
    return;
  }
  cart.push({ id: cat.id, name: cat.name, price: cat.price, image_url: cat.image_url });
  saveCart(cart);
  showToast('Đã thêm ' + cat.name + ' vào giỏ hàng 🛒');
  render(getFilteredCats());
  if (currentModalCat && currentModalCat.id === cat.id) {
    const addBtn = document.getElementById('m-add-cart-btn');
    addBtn.textContent = '✓ ĐÃ TRONG GIỎ';
  }
}
function addToCartFromModal() {
  if (currentModalCat) addToCart(currentModalCat);
}
function removeFromCart(catId) {
  saveCart(getCart().filter(c => c.id !== catId));
  renderCart();
}
function openCart() {
  renderCart();
  document.getElementById('cart-overlay').classList.remove('hidden');
  document.getElementById('cart-drawer').classList.add('open');
}
function closeCart() {
  document.getElementById('cart-drawer').classList.remove('open');
  document.getElementById('cart-overlay').classList.add('hidden');
}
function renderCart() {
  const cart = getCart();
  const wrap = document.getElementById('cart-items');
  if (cart.length === 0) {
    wrap.innerHTML = '<div class="cart-empty">Giỏ hàng đang trống. Hãy chọn một bé mèo bạn thích nhé! 🐾</div>';
  } else {
    wrap.innerHTML = cart.map(c => `
      <div class="cart-item">
        <img src="${c.image_url || ''}">
        <div class="info">
          <div class="name">${escapeHtml(c.name)}</div>
          <div class="price">${Number(c.price).toLocaleString('vi-VN')}đ</div>
        </div>
        <button class="btn-remove" onclick="removeFromCart('${c.id}')">✕</button>
      </div>
    `).join('');
  }
  const total = cart.reduce((sum, c) => sum + Number(c.price || 0), 0);
  document.getElementById('cart-total').textContent = total.toLocaleString('vi-VN') + 'đ';
  document.getElementById('cart-call').href = 'tel:' + CONTACT_PHONE;
  document.getElementById('cart-zalo').href = 'https://zalo.me/' + CONTACT_ZALO;
}

// --- HÀM KHỞI TẠO: LẤY DỮ LIỆU THẬT TỪ SUPABASE ---
async function init() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '<div class="empty" style="grid-column:1/-1;">Đang tải dữ liệu...</div>';

  // Lấy phiên đăng nhập hiện có (nếu trước đó đã đăng nhập)
  const { data: sessionData } = await supabaseClient.auth.getSession();
  currentUser = sessionData?.session?.user || null;
  updateAuthUI();
  await loadMyLikes();

  const { data, error } = await supabaseClient
    .from('cats')
    .select('*')
    .order('created_at', { ascending: false });

  if (error) {
    grid.innerHTML = '';
    document.getElementById('empty-msg').textContent = 'Lỗi tải dữ liệu: ' + error.message;
    document.getElementById('empty-msg').classList.remove('hidden');
    console.error(error);
    return;
  }

  allCats = data || [];
  populateBreedFilter(allCats);
  updateCartBadge();
  applyFilters(); // Hiển thị lần đầu
}

// Lấy danh sách giống mèo để đưa vào ô Select
function populateBreedFilter(cats) {
  const breeds = [...new Set(cats.map(c => c.breed).filter(Boolean))];
  const sel = document.getElementById('breed-filter');
  breeds.forEach(b => {
    const opt = document.createElement('option');
    opt.value = b; opt.textContent = b;
    sel.appendChild(opt);
  });
}

// Xử lý Lọc & Sắp xếp — trả về mảng đã lọc (không tự render)
function getFilteredCats() {
  const search = document.getElementById('search-box').value.trim().toLowerCase();
  const breed = document.getElementById('breed-filter').value;
  const status = document.getElementById('status-filter').value;
  const priceMin = document.getElementById('price-min').value;
  const priceMax = document.getElementById('price-max').value;

  let filtered = allCats.filter(c => {
    if (status !== 'all' && c.status !== status) return false;
    if (breed && c.breed !== breed) return false;
    if (search && !(c.name?.toLowerCase().includes(search) || c.breed?.toLowerCase().includes(search))) return false;
    if (priceMin && Number(c.price) < Number(priceMin)) return false;
    if (priceMax && Number(c.price) > Number(priceMax)) return false;
    return true;
  });

  const sortBy = document.getElementById('sort-filter').value;
  if (sortBy === 'price-asc') {
    filtered.sort((a, b) => Number(a.price) - Number(b.price));
  } else if (sortBy === 'price-desc') {
    filtered.sort((a, b) => Number(b.price) - Number(a.price));
  }

  return filtered;
}

function applyFilters() {
  render(getFilteredCats());
}

// Hiển thị ra màn hình (Grid)
function render(cats) {
  const grid = document.getElementById('grid');
  const emptyMsg = document.getElementById('empty-msg');
  if (cats.length === 0) {
    grid.innerHTML = '';
    emptyMsg.classList.remove('hidden');
    return;
  }
  emptyMsg.classList.add('hidden');
  grid.innerHTML = cats.map(c => {
    const liked = myLikedIds.has(c.id);
    const inCart = isInCart(c.id);
    return `
    <div class="cat-card" onclick='openModal(${JSON.stringify(c).replace(/'/g, "&#39;")})'>
      <button class="like-btn ${liked ? 'liked' : ''}" onclick="toggleLike('${c.id}', event)">
        ${liked ? '❤️' : '🤍'} ${c.likes_count || 0}
      </button>
      <div class="photo-wrap">
        <div class="tape"></div>
        <img src="${c.image_url || ''}" loading="lazy">
        ${c.status === 'sold' ? '<div class="sold-banner">ĐÃ BÁN</div>' : ''}
      </div>
      <div class="stamp">${(Number(c.price)/1000).toLocaleString('vi-VN')}k<br>đ</div>
      <div class="cat-body">
        <div class="name">${escapeHtml(c.name)}</div>
        <div class="cat-row"><span>Giống</span><span>${escapeHtml(c.breed || '—')}</span></div>
        <div class="cat-row"><span>Tuổi</span><span>${c.age_months ? c.age_months + ' tháng' : '—'}</span></div>
        <div class="status-line">
          <span class="status-chip ${c.status === 'sold' ? 'sold' : 'available'}">${c.status === 'sold' ? 'Đã bán' : 'Còn bán'}</span>
        </div>
        <button class="btn-add-cart" ${c.status === 'sold' ? 'disabled' : ''} onclick='event.stopPropagation(); addToCart(${JSON.stringify(c).replace(/'/g, "&#39;")})'>
          ${inCart ? '✓ ĐÃ TRONG GIỎ' : '+ THÊM VÀO GIỎ'}
        </button>
      </div>
    </div>
  `;
  }).join('');
}

// Mở Modal chi tiết
function openModal(c) {
  currentModalCat = c;
  document.getElementById('m-img').src = c.image_url || '';
  document.getElementById('m-name').textContent = c.name;
  document.getElementById('m-id').textContent = 'HỒ SƠ #' + String(c.id).slice(0, 8).toUpperCase();
  document.getElementById('m-price').innerHTML = (Number(c.price)/1000000).toLocaleString('vi-VN') + 'tr<br>đ';
  document.getElementById('m-breed').textContent = c.breed || '—';
  document.getElementById('m-gender').textContent = c.gender || '—';
  document.getElementById('m-age').textContent = c.age_months ? c.age_months + ' tháng' : '—';
  document.getElementById('m-status').textContent = c.status === 'sold' ? 'Đã bán' : 'Còn bán';
  document.getElementById('m-desc').textContent = c.description || '';
  document.getElementById('m-sold-banner').classList.toggle('hidden', c.status !== 'sold');
  updateModalLikeButton();

  const addBtn = document.getElementById('m-add-cart-btn');
  addBtn.disabled = c.status === 'sold';
  addBtn.textContent = isInCart(c.id) ? '✓ ĐÃ TRONG GIỎ' : '+ THÊM VÀO GIỎ';

  // Đã gán số điện thoại vào nút bấm
  document.getElementById('m-call').href = 'tel:' + CONTACT_PHONE;
  document.getElementById('m-zalo').href = 'https://zalo.me/' + CONTACT_ZALO;
  
  document.getElementById('overlay').classList.remove('hidden');
}

function updateModalLikeButton() {
  if (!currentModalCat) return;
  const liked = myLikedIds.has(currentModalCat.id);
  const btn = document.getElementById('m-like-btn');
  btn.classList.toggle('liked', liked);
  document.getElementById('m-like-count').textContent = currentModalCat.likes_count || 0;
  btn.innerHTML = (liked ? '❤️' : '🤍') + ' <span id="m-like-count">' + (currentModalCat.likes_count || 0) + '</span>';
}

// Đóng Modal
function closeModal() { 
  document.getElementById('overlay').classList.add('hidden'); 
}

// Chống lỗi HTML
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// Thông báo nhỏ (toast)
let toastTimer = null;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
}

// Chạy khởi tạo
init();
</script>
