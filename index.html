<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Motion Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#101722;color:#e6edf5;font:14px system-ui}header,footer{padding:14px;background:#1c2735}main{display:grid;grid-template-columns:1fr 300px;gap:12px;padding:12px}#view{height:60vh;min-height:300px}canvas{display:block}aside{padding:12px;background:#1c2735}button,select,input{background:#29394b;color:white;border:1px solid #53657a;border-radius:5px;padding:8px;margin:4px}input[type=range]{width:95%}label{display:block;margin-top:8px}pre{white-space:pre-wrap} @media(max-width:700px){main{grid-template-columns:1fr}}</style><header><b>AI MOTION STUDIO</b> · Previs / JSON · v0.2</header><main><section><div id="view"></div><button id="play">Phát / dừng</button><button id="reset">Về đầu</button><button id="record">Ghi video WebM</button><input id="time" type="range" min="0" max="3" step="0.033333"><span id="clock"></span><p id="status"></p></section><aside><label>Camera</label><select id="camera"><option value="front">Trước</option><option value="side">Bên</option><option value="back">Sau</option><option value="top">Trên</option><option value="orbit">Xoay quanh</option></select><label>Khớp cần chỉnh</label><select id="joint"></select><label>Trục xoay</label><select id="axis"><option>x</option><option>y</option><option>z</option></select><input id="angle" type="number" value="0" min="-180" max="180"><button id="key">Đặt keyframe</button><button id="download">Xuất JSON</button><label>Nhập dự án JSON</label><input id="upload" type="file" accept=".json"><pre id="info"></pre></aside></main><footer>Đồ họa hình khối · FK · camera độc lập · kéo chuột để xoay góc nhìn</footer><script type="module" src="./engine.js"></script></html>
