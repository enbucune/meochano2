<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Motion Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#101722;color:#e6edf5;font:14px system-ui}header,footer{padding:14px;background:#1c2735}main{display:grid;grid-template-columns:1fr 300px;gap:12px;padding:12px}#view{height:60vh;min-height:300px}canvas{display:block}aside{padding:12px;background:#1c2735}button,select,input{background:#29394b;color:white;border:1px solid #53657a;border-radius:5px;padding:8px;margin:4px}input[type=range]{width:95%}label{display:block;margin-top:8px}pre{white-space:pre-wrap} @media(max-width:700px){main{grid-template-columns:1fr}}</style><header><b>AI MOTION STUDIO</b> · Previs / JSON · v0.4</header><main><section><div id="view"></div><button id="play">Phát / dừng</button><button id="reset">Về đầu</button><button id="record">Ghi video WebM</button><input id="time" type="range" min="0" max="3" step="0.033333"><span id="clock"></span><p id="status"></p></section><aside><label>Thời lượng (giây)</label><input id="duration" type="number" min="1" max="600" value="40"><button id="setDuration">Áp dụng</button><label>Đến giây</label><input id="seek" type="number" min="0" step="0.1"><button id="go">Đến</button><label>Camera</label><select id="camera"><option value="front">Trước</option><option value="side">Bên</option><option value="back">Sau</option><option value="top">Trên</option><option value="orbit">Xoay quanh</option></select><label>Khoảng cách camera</label><input id="zoom" type="range" min="2" max="12" step="0.1" value="5"><label>Góc ngang (độ)</label><input id="camAz" type="number" value="0"><label>Góc cao (độ)</label><input id="camEl" type="number" value="15" min="-80" max="89"><button id="camKey">Lưu keyframe camera</button><button id="camPreview">Xem góc đang chỉnh</button><label><input id="camAuto" type="checkbox" checked> Phát camera theo keyframe</label><label>Kiểu nội suy cho keyframe mới</label><select id="ease"><option value="smooth">Mượt (tăng/giảm tốc)</option><option value="linear">Đều</option><option value="hold">Giữ rồi đổi ngay</option></select><label>Khớp cần chỉnh</label><select id="joint"></select><label>Trục xoay</label><select id="axis"><option>x</option><option>y</option><option>z</option></select><input id="angle" type="number" value="0" min="-180" max="180"><button id="key">Lưu keyframe khớp</button><button id="readPose">Đọc góc hiện tại</button><button id="delKey">Xóa keyframe khớp tại đây</button><label>Keyframe của khớp / camera</label><select id="markers" size="5" style="width:95%"></select><button id="jumpKey">Đến keyframe</button><button id="delCam">Xóa keyframe camera tại đây</button><button id="download">Xuất JSON</button><label>Nhập dự án JSON</label><input id="upload" type="file" accept=".json"><pre id="info"></pre></aside></main><footer>Hai nhân vật · chuyển động toàn thân · FK · camera độc lập · kéo chuột để xoay góc nhìn</footer><script type="module" src="./engine.js"></script></html>
